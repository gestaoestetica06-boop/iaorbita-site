name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' --exclude='./README.md' --exclude='*.parte*' --exclude='*.gitkeep' -cf - . | tar -xf - -C _site
          # O filme do topo fica no repositório como um pacote tar dividido em duas partes (limite de envio pelo navegador).
          # Aqui as partes são unidas, o filme sai do pacote e é conferido pela soma SHA-256.
          cat assets/media/hero.mp4.parte1 assets/media/hero.mp4.parte2 | tar -xf - -C _site/assets/media hero.mp4
          echo "ff6f7c07daa3207f87cc44dea89763f5e07d134382e1858d0188a776944658b7  _site/assets/media/hero.mp4" | sha256sum -c -
          ls -la _site _site/assets/media

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicacao
        uses: actions/deploy-pages@v4
